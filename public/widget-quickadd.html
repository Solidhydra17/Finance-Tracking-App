<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1729;
      color: #fff;
      padding: 16px;
      border-radius: 20px;
    }
    .label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #285ccc;
      margin-bottom: 12px;
    }
    .buttons { display: flex; flex-direction: column; gap: 10px; }
    a {
      display: block;
      text-align: center;
      padding: 14px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      text-decoration: none;
      letter-spacing: 0.02em;
    }
    .income { background: #22c55e; color: #fff; }
    .expense { background: #ef4444; color: #fff; }
  </style>
</head>
<body>
  <div class="label">KURIPOT · Quick Add</div>
  <div class="buttons">
    <a class="income" href="https://kuripot.onrender.com/add-transaction?type=income">+ Income</a>
    <a class="expense" href="https://kuripot.onrender.com/add-transaction?type=expense">− Expense</a>
  </div>
</body>
</html>
