name: Build and Release Android APK

on:
  push:
    branches: [main, 'update/**', 'updated/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/kuripot-release.keystore

      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Get version from package.json
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Get short commit SHA
        id: sha
        run: echo "SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Rename APK to kuripot.apk
        run: cp android/app/build/outputs/apk/release/app-release.apk kuripot.apk

      - name: Delete existing latest release and tag if they exist
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push --delete origin latest 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Kuripot v${{ steps.version.outputs.VERSION }} (${{ steps.sha.outputs.SHA }})"
          body: |
            🤖 Automated build from commit ${{ steps.sha.outputs.SHA }}

            **Branch:** ${{ github.ref_name }}
            **Version:** ${{ steps.version.outputs.VERSION }}
            **Built:** ${{ github.event.head_commit.timestamp }}
            **Commit message:** ${{ github.event.head_commit.message }}

            ---
            ### Install Instructions
            1. Download `kuripot.apk` below
            2. On your Android phone, open the downloaded file
            3. If prompted, allow installs from unknown sources in your phone settings
            4. Install — updates cleanly without losing your data ✅
          files: kuripot.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
